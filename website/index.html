<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Visitor Log</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-building"></i> Society Visitor Log</h1>
            <p class="subtitle">Track and monitor society visitors</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <h3>Today's Visitors</h3>
                <p id="todayVisitors">Loading...</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <h3>Currently Inside</h3>
                <p id="currentVisitors">Loading...</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-door-open"></i>
                <h3>Total Flats Visited</h3>
                <p id="totalFlats">Loading...</p>
            </div>
        </div>

        <div class="visitors-list">
            <div class="list-header">
                <h2><i class="fas fa-list"></i> Recent Visitors</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search visitors...">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="visitors-grid" id="visitorsGrid">
                <!-- Visitor cards will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Visitor Details Modal -->
    <div id="visitorModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="visitor-details">
                <img id="modalImage" src="" alt="Visitor Photo" class="modal-image">
                <div class="visitor-info">
                    <h2 id="modalName"></h2>
                    <p><i class="fas fa-home"></i> <span id="modalFlat"></span></p>
                    <p><i class="fas fa-clock"></i> <span id="modalTime"></span></p>
                    <p><i class="fas fa-phone"></i> <span id="modalPhone"></span></p>
                    <p><i class="fas fa-info-circle"></i> <span id="modalPurpose"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
